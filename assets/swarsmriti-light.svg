  <title id="t">SwarSmriti: AI memory voice companion. Record memories and voices, then talk with a memory-aware AI version of the people who matter.</title>
  <style>
    /* Theme colours (light). The dark file is the same drawing: only this block changes. */
    svg {
      --card: #f6f8fa; --line: #d1d9e0; --panel: #ffffff; --panel-line: #d1d9e0;
      --text: #1f2328; --body: #3d444d; --muted: #59636e;
      --accent: #14b8a6; --ink: #0f766e; --on-accent: #0d1117;
      --node: #8c959f; --faint: #eaeef2; --chip: #ffffff;
    }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .card { fill: var(--card); stroke: var(--line); }
    .panel { fill: var(--panel); stroke: var(--panel-line); }
    .title { fill: var(--text); font-weight: 700; }
    .text { fill: var(--text); }
    .body { fill: var(--body); }
    .muted { fill: var(--muted); }
    .tag { fill: var(--ink); letter-spacing: 1.4px; }
    .ink { fill: var(--ink); }
    .accent { fill: var(--accent); }
    .on-accent { fill: var(--on-accent); }
    .node-fill { fill: var(--node); }
    .chip rect { fill: var(--chip); stroke: var(--line); }
    .chip text { fill: var(--body); }
    .playhead { stroke: var(--ink); stroke-width: 1.5; }
    .eq { transform-box: fill-box; transform-origin: center; animation: eq 1.6s ease-in-out infinite; }
    .d1 { animation-delay: -0.5s; }
    .d2 { animation-delay: -1.1s; }
    @keyframes eq { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.6); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

