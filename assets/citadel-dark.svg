<svg xmlns="http://www.w3.org/2000/svg" width="410" height="450" viewBox="0 0 410 450" role="img" aria-labelledby="t">
  <title id="t">Citadel Maps: street-safety heatmap for women walking at night, with community hazard reports, scored routes and proximity alerts.</title>
  <style>
    /* Theme colours (dark). The light file is the same drawing: only this block changes. */
    svg {
      --card: #151b23; --line: #2a313c; --panel: #0d1117; --panel-line: #21262d;
      --text: #e6edf3; --body: #c9d1d9; --muted: #9198a1;
      --accent: #2dd4bf; --ink: #2dd4bf; --on-accent: #0d1117;
      --node: #545d68; --faint: #1c2129; --chip: #0d1117;
    }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .card { fill: var(--card); stroke: var(--line); }
    .panel { fill: var(--panel); stroke: var(--panel-line); }
    .title { fill: var(--text); font-weight: 700; }
    .text { fill: var(--text); }
    .body { fill: var(--body); }
    .muted { fill: var(--muted); }
    .tag { fill: var(--ink); letter-spacing: 1.4px; }
    .ink { fill: var(--ink); }
    .accent { fill: var(--accent); }
    .on-accent { fill: var(--on-accent); }
    .node-fill { fill: var(--node); }
    .chip rect { fill: var(--chip); stroke: var(--line); }
    .chip text { fill: var(--body); }
    .street { fill: none; stroke: var(--line); stroke-width: 7; stroke-linecap: round; opacity: 0.6; }
    .risk { fill: var(--muted); opacity: 0.18; }
    .hazard { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linejoin: round; }
    .risky { fill: none; stroke: var(--node); stroke-width: 2; stroke-dasharray: 3 5; }
    .route { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .walker { fill: var(--text); }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- Card background -->
  <rect class="card" x="0.5" y="0.5" width="409" height="449" rx="16"/>

  <!-- Top: illustration -->
    <rect class="panel" x="20" y="20" width="370" height="164" rx="12"/>
    <text class="mono muted" x="36" y="42" font-size="10">safest route · night mode</text>
    <line class="street" x1="40" y1="70" x2="370" y2="70"/>
    <line class="street" x1="40" y1="118" x2="370" y2="118"/>
    <line class="street" x1="40" y1="160" x2="370" y2="160"/>
    <line class="street" x1="90" y1="56" x2="90" y2="170"/>
    <line class="street" x1="170" y1="56" x2="170" y2="170"/>
    <line class="street" x1="250" y1="56" x2="250" y2="170"/>
    <line class="street" x1="330" y1="56" x2="330" y2="170"/>
    <circle class="risk" cx="200" cy="118" r="28"/>
    <circle class="risk" cx="150" cy="70" r="22"/>
    <path class="hazard" d="M200 106 L 208 120 L 192 120 Z"/>
    <path class="hazard" d="M150 58 L 158 72 L 142 72 Z"/>
    <path class="risky" d="M90 160 V 118 H 330 V 70"/>
    <path class="route" d="M90 160 H 250 V 70 H 330"/>
    <circle class="walker" r="4"><animateMotion dur="5s" repeatCount="indefinite" path="M90 160 H 250 V 70 H 330"/></circle>
    <circle class="node-fill" cx="90" cy="160" r="6"/>
    <text class="mono muted" x="76" y="152" font-size="10" text-anchor="end">A</text>
    <circle class="accent" cx="330" cy="70" r="8"/>
    <text class="mono ink" x="346" y="66" font-size="10">B</text>

  <!-- Bottom: what it is, proof, stack -->
    <text class="mono tag" x="24" y="220" font-size="11.5">HACKATHON · CODESTORM 2025</text>
    <text class="sans title" x="24" y="252" font-size="22" letter-spacing="-0.3">Citadel Maps</text>
    <text class="sans body" x="24" y="282" font-size="14">A street-safety heatmap for women walking at</text>
    <text class="sans body" x="24" y="303" font-size="14">night: community hazard reports, scored routes</text>
    <text class="sans body" x="24" y="324" font-size="14">and instant alerts near reported risks.</text>
    <text class="sans title" x="24" y="366" font-size="18">Live</text>
    <text class="sans muted" x="24" y="385" font-size="11.5">hazard reports</text>
    <text class="sans title" x="146" y="366" font-size="18">Scored</text>
    <text class="sans muted" x="146" y="385" font-size="11.5">safest-route pick</text>
    <text class="sans title" x="268" y="366" font-size="18">Instant</text>
    <text class="sans muted" x="268" y="385" font-size="11.5">proximity alerts</text>
    <g class="chip"><rect x="24" y="402" width="89" height="26" rx="13"/><text class="mono" x="34" y="419" font-size="11.5">JavaScript</text></g>
    <g class="chip"><rect x="121" y="402" width="75" height="26" rx="13"/><text class="mono" x="131" y="419" font-size="11.5">Firebase</text></g>
    <g class="chip"><rect x="204" y="402" width="41" height="26" rx="13"/><text class="mono" x="214" y="419" font-size="11.5">GIS</text></g>
    <g class="chip"><rect x="253" y="402" width="61" height="26" rx="13"/><text class="mono" x="263" y="419" font-size="11.5">Vercel</text></g>
</svg>
