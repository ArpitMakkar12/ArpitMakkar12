  <!-- Bottom: what it is, proof, stack -->
    <text class="mono tag" x="24" y="220" font-size="11.5">DATA SCIENCE · SABUDH FOUNDATION</text>
    <text class="sans title" x="24" y="252" font-size="22" letter-spacing="-0.3">EV Infrastructure Planning</text>
    <text class="sans body" x="24" y="282" font-size="14">Predicts EV charging demand and ranks real</text>
    <text class="sans body" x="24" y="303" font-size="14">sites by profit and equity, validated across</text>
    <text class="sans body" x="24" y="324" font-size="14">two countries with zero architecture changes.</text>
    <text class="sans title" x="24" y="366" font-size="20">87%</text>
    <text class="sans muted" x="24" y="385" font-size="11.5">ensemble accuracy</text>
    <text class="sans title" x="146" y="366" font-size="20">83%</text>
    <text class="sans muted" x="146" y="385" font-size="11.5">in new Indian cities</text>
    <text class="sans title" x="268" y="366" font-size="20">300</text>
    <text class="sans muted" x="268" y="385" font-size="11.5">sites per scenario</text>
