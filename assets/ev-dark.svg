    <circle class="heat1" cx="318" cy="80" r="30"/>
    <circle class="heat3" cx="318" cy="80" r="15"/>
    <circle class="heat1" cx="88" cy="150" r="24"/>
    <circle class="node-fill" cx="60" cy="70" r="2.5"/>
    <circle class="node-fill" cx="84" cy="96" r="2.5"/>
    <circle class="node-fill" cx="118" cy="146" r="2.5"/>
