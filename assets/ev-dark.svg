    <rect class="panel" x="20" y="20" width="370" height="164" rx="12"/>
    <text class="mono muted" x="36" y="42" font-size="10">candidate sites · ranked by demand and equity</text>
    <line class="grid" x1="66" y1="52" x2="66" y2="172"/>
