    <circle class="node-fill" cx="300" cy="106" r="2.5"/>
    <circle class="accent" cx="150" cy="112" r="11"/>
    <text class="mono on-accent" x="150" y="116" font-size="11" font-weight="700" text-anchor="middle">1</text>
    <circle class="accent" cx="262" cy="134" r="11"/>
    <text class="mono on-accent" x="262" y="138" font-size="11" font-weight="700" text-anchor="middle">2</text>
