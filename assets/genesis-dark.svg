<svg xmlns="http://www.w3.org/2000/svg" width="840" height="336" viewBox="0 0 840 336" role="img" aria-labelledby="t">
  <title id="t">GENESIS: a flight simulator for synthetic biology. Predicts E. coli responses to conditions, engineered DNA and knockouts. Essential-gene MCC 0.725; growth-rate error 0.111 per hour.</title>
  <style>
    /* Theme colours (dark). The light file is the same drawing: only this block changes. */
    svg {
      --card: #151b23; --line: #2a313c; --panel: #0d1117; --panel-line: #21262d;
      --text: #e6edf3; --body: #c9d1d9; --muted: #9198a1;
      --accent: #2dd4bf; --ink: #2dd4bf; --on-accent: #0d1117;
      --node: #545d68; --faint: #1c2129; --chip: #0d1117;
    }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .card { fill: var(--card); stroke: var(--line); }
    .panel { fill: var(--panel); stroke: var(--panel-line); }
    .title { fill: var(--text); font-weight: 700; }
    .text { fill: var(--text); }
    .body { fill: var(--body); }
    .muted { fill: var(--muted); }
    .tag { fill: var(--ink); letter-spacing: 1.4px; }
    .ink { fill: var(--ink); }
    .accent { fill: var(--accent); }
    .on-accent { fill: var(--on-accent); }
    .node-fill { fill: var(--node); }
    .chip rect { fill: var(--chip); stroke: var(--line); }
    .chip text { fill: var(--body); }
    .link { stroke: var(--faint); stroke-width: 2; }
    .step { fill: var(--panel); stroke: var(--node); stroke-width: 1.5; }
    .axis { stroke: var(--node); stroke-width: 1.2; }
    .ideal { stroke: var(--node); stroke-width: 1.2; stroke-dasharray: 3 4; }
    .ping { fill: none; stroke: var(--ink); stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: ping 1.8s ease-out infinite; }
    @keyframes ping { 0% { transform: scale(0.6); opacity: 0.9; } 100% { transform: scale(1.9); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- Card background -->
  <rect class="card" x="0.5" y="0.5" width="839" height="335" rx="16"/>

  <!-- Left: what it is, proof, stack -->
    <text class="mono tag" x="32" y="52" font-size="12">COMPUTATIONAL BIOLOGY · TEAM OF 4</text>
    <text class="sans title" x="32" y="94" font-size="34" letter-spacing="-0.5">GENESIS</text>
    <text class="sans muted" x="32" y="122" font-size="15">A flight simulator for synthetic biology</text>
    <text class="sans body" x="32" y="158" font-size="15">Predicts how <tspan font-style="italic">E. coli</tspan> responds to temperature,</text>
    <text class="sans body" x="32" y="180" font-size="15">pH, engineered DNA and gene knockouts, then</text>
    <text class="sans body" x="32" y="202" font-size="15">models growth before any lab work begins.</text>
    <text class="sans title" x="32" y="246" font-size="24">0.725</text>
    <text class="sans muted" x="32" y="265" font-size="11.5">essential-gene MCC</text>
    <text class="sans title" x="162" y="246" font-size="24">0.111 h⁻¹</text>
    <text class="sans muted" x="162" y="265" font-size="11.5">growth-rate error</text>
    <text class="sans title" x="292" y="246" font-size="24">10,783</text>
    <text class="sans muted" x="292" y="265" font-size="11.5">regulatory interactions</text>
    <g class="chip"><rect x="32" y="286" width="68" height="26" rx="13"/><text class="mono" x="42" y="303" font-size="11.5">FastAPI</text></g>
    <g class="chip"><rect x="108" y="286" width="68" height="26" rx="13"/><text class="mono" x="118" y="303" font-size="11.5">Next.js</text></g>
    <g class="chip"><rect x="184" y="286" width="68" height="26" rx="13"/><text class="mono" x="194" y="303" font-size="11.5">COBRApy</text></g>
    <g class="chip"><rect x="260" y="286" width="68" height="26" rx="13"/><text class="mono" x="270" y="303" font-size="11.5">PyTorch</text></g>
    <g class="chip"><rect x="336" y="286" width="75" height="26" rx="13"/><text class="mono" x="346" y="303" font-size="11.5">HyenaDNA</text></g>

  <!-- Right: simulation pipeline and predicted-vs-measured growth -->
    <rect class="panel" x="460" y="24" width="356" height="288" rx="12"/>
    <text class="mono muted" x="478" y="52" font-size="10.5">simulated <tspan font-style="italic">E. coli</tspan> K-12</text>
    <text class="mono muted" x="798" y="52" font-size="10.5" text-anchor="end">iML1515 · 2,712 reactions</text>
    <line class="link" x1="490" y1="88" x2="490" y2="248"/>
    <circle class="step" cx="490" cy="88" r="7"/>
    <text class="mono body" x="506" y="92" font-size="11">conditions</text>
    <circle class="step" cx="490" cy="128" r="7"/>
    <text class="mono body" x="506" y="132" font-size="11">regulators</text>
    <circle class="step" cx="490" cy="168" r="7"/>
    <text class="mono body" x="506" y="172" font-size="11">gene expression</text>
    <circle class="step" cx="490" cy="208" r="7"/>
    <text class="mono body" x="506" y="212" font-size="11">reaction bounds</text>
    <circle class="accent" cx="490" cy="248" r="7"/>
    <text class="mono ink" x="506" y="252" font-size="11">flux balance</text>
    <circle class="ping" cx="490" cy="248" r="9"/>
    <line class="axis" x1="662" y1="86" x2="662" y2="236"/>
    <line class="axis" x1="662" y1="236" x2="796" y2="236"/>
    <line class="ideal" x1="662" y1="236" x2="796" y2="86"/>
    <circle class="accent" cx="680.8" cy="206.0" r="4"/>
    <circle class="accent" cx="702.2" cy="195.5" r="4"/>
    <circle class="accent" cx="721.0" cy="161.0" r="4"/>
    <circle class="accent" cx="739.7" cy="153.5" r="4"/>
    <circle class="accent" cx="761.2" cy="116.0" r="4"/>
    <circle class="accent" cx="779.9" cy="110.0" r="4"/>
    <text class="mono muted" x="729.0" y="252" font-size="9.5" text-anchor="middle">measured growth</text>
    <text class="mono muted" x="654" y="161.0" font-size="9.5" text-anchor="middle" transform="rotate(-90 654 161.0)">predicted</text>
    <text class="mono muted" x="798" y="294" font-size="10.5" text-anchor="end">6 conditions · Pearson 0.85</text>
</svg>
